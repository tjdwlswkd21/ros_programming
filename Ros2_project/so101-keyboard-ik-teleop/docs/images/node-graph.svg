<text x="186" y="885" font-size="12.5" fill="#4b5563">※ 점선 박스·화살표는 디버깅용(선택)이다. 조작에는 필요 없고, 목표·현재 손목 위치와 관절각은 터미널 로그로도 확인한다.</text>
<text x="186" y="907" font-size="12.5" fill="#4b5563">※ /joint_states는 wrist_node·direct_node도 구독한다(시작 때 목표를 현재 관절각에 맞춤). 선을 줄이려고 ik_node만 그렸다.</text>
<text x="186" y="929" font-size="12.5" fill="#4b5563">※ GLFW 창은 WSLg가 Windows 화면에 띄워준다 (우분투 데스크톱 불필요). 키 안내·경고는 노드를 실행한 터미널에 출력한다.</text>
<text x="186" y="951" font-size="12.5" fill="#4b5563">※ 노드 안의 블럭끼리는 함수 호출로 데이터를 주고받고, 노드 사이만 토픽을 쓴다. 토픽 아래 작은 글씨는 메시지 타입(안)이다.</text>
<text x="1700" y="740" font-size="12.5" fill="#374151">실선 = 필수 토픽</text>
<text x="1700" y="762" font-size="12.5" fill="#374151">점선 = 디버깅용(선택)·설정 파일</text>
